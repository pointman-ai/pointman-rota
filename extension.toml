[extension]
id = "rota"
name = "Rota"
version = "0.10.0"
publisher = "aurelio"
summary = "Claude accounts taken in turns: each run starts on the account with the most room left."
node = ">=0.1,<1"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
runtime = "binary"               # one build per platform, each release (.github/workflows/release.yml)
command = ["bin/rota", "serve"]

[permissions]
network = true
secrets = ["rota.*"]             # each account's token, kept in the vault as rota.<label>

# the node asks rota which account each Claude Code or Codex run starts on, and tells it how the run ended
[sessions]
clients = ["claude", "codex"]
env = ["CLAUDE_CODE_OAUTH_TOKEN", "CODEX_HOME"]

# each account: the apps offer /rota add, and an alert until there's one (MB-154)
[[credentials]]
id = "account"
title = "Claude account"
help = "Run `claude setup-token` signed in as the account, and paste the token it prints."
item = "rota.{label}"
value = "sk-ant-oat\\d+-[A-Za-z0-9_-]{20,}"
placeholder = "sk-ant-oat01-…"
needed = 1
sign_in = true                   # or Sign in: rota runs `claude setup-token`, and the token goes in the vault (MB-216)

[settings]
type = "object"

[settings.properties.threshold]
type = "integer"
minimum = 50
maximum = 100
default = 90
description = "Move new runs off an account once either window is this full (%)"

[settings.properties.cooldown_minutes]
type = "integer"
minimum = 0
default = 10
description = "After moving runs to another account, stay on it this long, unless it can't take runs at all"

[settings.properties.check_minutes]
type = "integer"
minimum = 5
default = 30
description = "How often an account nothing has run on is checked, with a one-line Haiku run"

[[commands]]
kind = "rota.status"
title = "Accounts and their limits"
params = { type = "object", properties = {} }

[[commands]]
kind = "rota.usage"
title = "Each account's use"
params = { type = "object", properties = {} }
slash = "usage"
summary = "Each Claude account's 5-hour and weekly use, and which one new runs start on"

# `/rota add` is rota's own command (James, Pointman thread 1018 [4459]): the apps open the account form for
# it, so Sign in or a pasted token goes into the vault and never into a post
[[commands]]
kind = "rota.add"
title = "Add a Claude account"
params = { type = "object", properties = { name = { type = "string", description = "What to call it (work): lowercase letters, digits, . _ -" } } }
slash = "add"
form = "account"
summary = "Add a Claude account: sign in to it, or paste a token from claude setup-token"

[[commands]]
kind = "rota.swap"
title = "Start new runs on another account"
params = { type = "object", properties = { to = { type = "string", description = "The account's label (work); left out, the one with the most room." } } }
slash = "swap"
summary = "Start new runs on another account, or the one with the most room"

[[commands]]
kind = "rota.rename"
title = "Rename an account"
params = { type = "object", required = ["from", "to"], properties = { from = { type = "string", description = "The account's name now (default is this machine's own login)." }, to = { type = "string", description = "Its new name: lowercase letters, digits, . _ -" } } }
slash = "rename"
summary = "Rename an account: /rota rename default james-max"

[[commands]]
kind = "rota.agent"
title = "Start an agent's runs on one account"
params = { type = "object", required = ["agent"], properties = { agent = { type = "string", description = "The agent's handle (scene)." }, account = { type = "string", description = "The account's label; left out, the agent's runs follow the rule again." } } }

[[commands]]
kind = "rota.folder"
title = "Start a folder's runs on one account"
params = { type = "object", required = ["folder"], properties = { folder = { type = "string", description = "An agent's folder on this machine." }, account = { type = "string", description = "The account's label; left out, the folder's runs follow the rule again." } } }

[[events]]
name = "rota.accounts"
description = "Each account's 5-hour and weekly use, when each resets, and which one runs start on"

[[panels]]
id = "accounts"
title = "Claude accounts"
description = "How full each account's 5-hour and weekly windows are"
command = "rota.usage"
refresh = ["rota.accounts"]

# the same as a pane (Pointman's docs/dev/panes.md): a meter for each account's windows, and buttons that
# move new runs; it moves as checks and swaps come in
[[panes]]
id = "accounts"
title = "Claude accounts"
format = "blocks"
opens = ["command", "menu"]      # menu: picked by hand from the apps, with no target
