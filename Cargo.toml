[package]
name = "rota"
version = "0.13.3"
edition = "2021"
description = "Claude accounts taken in turns: each run starts on the account with the most room left."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-rota"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "d534ff202e24b802520e51a15ffefd78c0af1583" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
