[package]
name = "rota"
version = "0.10.1"
edition = "2021"
description = "Claude accounts taken in turns: each run starts on the account with the most room left."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-rota"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "a765a5f46e0c347fb9fa457e6b3aaa8bb3a4ae5f" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
